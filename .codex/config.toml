# Project-scoped MCP configuration. Codex applies it only for trusted projects.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
enabled_tools = ["resolve-library-id", "query-docs"]
default_tools_approval_mode = "auto"
startup_timeout_sec = 15
tool_timeout_sec = 45

# Optional API key header. Do not commit the value.
# [mcp_servers.context7.env_http_headers]
# CONTEXT7_API_KEY = "CONTEXT7_API_KEY"

[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@0.0.76",
  "--isolated",
  "--headless",
  "--sandbox",
  "--block-service-workers",
  "--allowed-origins",
  "http://localhost:*;http://127.0.0.1:*;https://localhost:*;https://127.0.0.1:*",
  "--output-dir",
  ".codex-artifacts/playwright",
]
enabled = true
required = false
enabled_tools = [
  "browser_click",
  "browser_close",
  "browser_console_messages",
  "browser_hover",
  "browser_navigate",
  "browser_navigate_back",
  "browser_network_requests",
  "browser_press_key",
  "browser_resize",
  "browser_select_option",
  "browser_snapshot",
  "browser_tabs",
  "browser_take_screenshot",
  "browser_type",
  "browser_wait_for",
]
disabled_tools = [
  "browser_drop",
  "browser_evaluate",
  "browser_file_upload",
  "browser_fill_form",
  "browser_network_request",
  "browser_run_code_unsafe",
]
default_tools_approval_mode = "prompt"
startup_timeout_sec = 30
tool_timeout_sec = 60
